<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chismebot Customer Cards</title>

  <style>
    :root {
      --bg:#000; --card:#1b1b1b; --border:#333;
      --text:#eee; --muted:#9a9a9a;
      --hot:#ff6a00; --stove:#ff2d2d;
      --fridge:#75dcff; --fridge-dark:#174e63;
      --fridge-light:#dff8ff;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    .back-arrow {
      position: fixed;
      top: 14px;
      left: 16px;
      font-size: 32px;
      color: white;
      text-decoration: none;
      z-index: 9999;
    }
    
    .app {
      min-height:100dvh;
      padding:56px 10px 10px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .toggle {
      display:grid;
      grid-template-columns:repeat(3, minmax(0, 1fr));
      gap:8px;
      position:sticky;
      top:0;
      background:#000;
      padding-bottom:6px;
      z-index:5;
    }

    .toggle button {
      min-width:0;
      padding:11px 4px;
      background:#111;
      border:1px solid var(--border);
      color:var(--text);
      font-weight:900;
      font-size:12px;
      line-height:1.05;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:5px;
    }

    .toggle button.active.hotbtn {
      border-color:var(--hot);
      color:var(--hot);
    }

    .toggle button.active.stovebtn {
      border-color:var(--stove);
      color:var(--stove);
    }

    .toggle button.active.fridgebtn {
      border-color:var(--fridge);
      color:var(--fridge);
      box-shadow:0 0 0 2px rgba(117,220,255,.12);
    }

    .section-title {
      margin:8px 0 4px;
      font-weight:900;
      letter-spacing:0.08em;
      color:var(--muted);
      font-size:18px;
    }

    .stack {
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card {
      background:var(--card);
      border:1px solid var(--border);
      padding:12px;
    }

    .banner {
      font-weight:900;
      padding:8px 10px;
      margin:-12px -12px 12px -12px;
      border-bottom:1px solid var(--border);
      letter-spacing:0.03em;
    }

    .hot .banner {
      background:rgba(255,106,0,0.16);
      color:var(--hot);
      border-bottom-color:var(--hot);
    }

    .stove .banner {
      background:rgba(255,45,45,0.16);
      color:var(--stove);
      border-bottom-color:var(--stove);
    }

    .name {
      font-size:24px;
      font-weight:900;
      margin-bottom:8px;
      line-height:1.05;
    }

    .meta {
      color:var(--muted);
      font-size:14px;
      margin-bottom:10px;
      line-height:1.35;
      word-break:break-word;
    }

    .field {
      font-size:15px;
      margin:6px 0;
      color:#ddd;
      line-height:1.3;
    }

    .muted { color:var(--muted); }

    .empty {
      color:var(--muted);
      border:1px solid var(--border);
      padding:18px;
      background:#111;
      line-height:1.35;
    }
    

    /* Refrigerator tab icon */
    .pixel-fridge-icon {
      width:15px;
      height:19px;
      position:relative;
      display:inline-block;
      background:#bcefff;
      border:2px solid #edfcff;
      box-shadow:
        2px 0 0 #458da8,
        -2px 0 0 #0f3544,
        0 2px 0 #0f3544;
      flex:0 0 auto;
    }

    .pixel-fridge-icon::before {
      content:"";
      position:absolute;
      left:0;
      right:0;
      top:7px;
      height:2px;
      background:#0f3544;
    }

    .pixel-fridge-icon::after {
      content:"";
      position:absolute;
      right:1px;
      top:2px;
      width:2px;
      height:4px;
      background:#0f3544;
      box-shadow:0 9px 0 #0f3544;
    }

    /* The refrigerator itself is the workspace. */
    .fridge-shell {
      width:100%;
      max-width:520px;
      margin:4px auto 14px;
      background:#08222d;
      border:5px solid #020506;
      box-shadow:
        0 0 0 4px var(--fridge-dark),
        0 0 0 8px #020506,
        0 10px 0 #020506;
      font-family:"Courier New", monospace;
    }

    .fridge-header {
      min-height:54px;
      padding:11px 50px 10px 12px;
      display:flex;
      align-items:center;
      gap:10px;
      color:#082531;
      background:
        linear-gradient(90deg, rgba(255,255,255,.55), transparent 24%),
        linear-gradient(#e3f9ff, #9bd9ef);
      border-bottom:5px solid #123c4c;
      font-weight:900;
      letter-spacing:.07em;
      text-transform:uppercase;
      text-shadow:1px 1px 0 #fff;
      position:relative;
    }

    .fridge-handle {
      position:absolute;
      right:15px;
      top:10px;
      width:9px;
      height:34px;
      background:#123c4c;
      box-shadow:-3px 0 0 #e7fbff;
    }

    .fridge-cavity {
      position:relative;
      min-height:0;
      padding:18px 14px 24px;
      background:
        linear-gradient(90deg, rgba(255,255,255,.08), transparent 20%),
        linear-gradient(#77bdd5, #4c91aa);
      border:6px solid #123c4c;
    }

    .fridge-inner {
      position:relative;
      min-height:0;
      padding:18px 14px 30px;
      background:#061820;
      border:4px solid #dbf6ff;
      box-shadow:
        inset 0 0 0 4px #266d87,
        inset 0 -18px 0 #0a2b38;
      overflow:visible;
    }


    .fridge-light {
      width:38px;
      height:10px;
      margin:0 auto 18px;
      background:#fff7a3;
      box-shadow:
        0 0 0 3px #d9ab2e,
        0 0 16px 5px rgba(255,244,150,.35);
      position:relative;
      z-index:2;
    }

    .customer-fridge-card {
      position:relative;
      z-index:2;
      background:#0e2732;
      border:3px solid var(--fridge);
      padding:14px;
      box-shadow:
        4px 4px 0 #020506,
        inset 0 0 0 2px #23566a;
    }

    .fridge-card-top {
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
      border-bottom:2px solid #23566a;
      padding-bottom:10px;
      margin-bottom:10px;
    }

    .fridge-name {
      color:#fff;
      font-size:24px;
      line-height:1.05;
      font-weight:900;
      text-transform:uppercase;
      word-break:break-word;
      text-shadow:2px 2px 0 #123c4c;
    }

    .fridge-temp {
      flex:0 0 auto;
      min-width:58px;
      padding:7px 6px;
      color:#071920;
      background:#dff8ff;
      border:3px solid #1b566d;
      font-size:21px;
      font-weight:900;
      text-align:center;
      box-shadow:3px 3px 0 #020506;
    }

    .fridge-contact {
      display:grid;
      gap:7px;
      margin-bottom:12px;
      color:#f4fcff;
      font-size:14px;
      line-height:1.35;
    }

    .fridge-contact-row {
      padding:7px 8px;
      background:#071920;
      border:2px solid #1f5366;
      word-break:break-word;
    }

    .fridge-contact-row b {
      color:var(--fridge);
      text-transform:uppercase;
      letter-spacing:.06em;
      font-size:11px;
      display:block;
      margin-bottom:3px;
    }

    .chisme-log {
      margin-top:10px;
      padding:11px;
      min-height:110px; height:auto;
      color:#241c00;
      background:#fff2a8;
      border:3px solid #886900;
      box-shadow:4px 4px 0 #352900;
      transform:rotate(-.25deg);
    }

    .chisme-log-title {
      margin-bottom:8px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      border-bottom:2px dashed #886900;
      padding-bottom:5px;
    }

    .chisme-entry {
      padding:8px 0;
      border-bottom:1px dashed rgba(70,53,0,.4);
      white-space:pre-wrap;
      line-height:1.35;
      font-size:14px;
    }

    .chisme-entry:last-child { border-bottom:0; }

    .chisme-date {
      display:block;
      margin-bottom:3px;
      font-size:11px;
      font-weight:900;
      color:#655000;
    }

    .fridge-nav {
      position:relative;
      z-index:2;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-top:18px;
    }

    .fridge-nav button {
      padding:11px 8px;
      color:#082531;
      background:#dff8ff;
      border:3px solid #123c4c;
      font-family:"Courier New", monospace;
      font-weight:900;
      text-transform:uppercase;
      box-shadow:3px 3px 0 #020506;
    }

    .fridge-counter {
      position:relative;
      z-index:2;
      margin-top:12px;
      color:#98e3fa;
      text-align:center;
      font-size:12px;
      letter-spacing:.07em;
    }

    .pixel-food {
      position:absolute;
      z-index:0;
      left:25px;
      bottom:27px;
      width:22px;
      height:17px;
      background:#ffd84b;
      border:3px solid #755700;
      box-shadow:
        34px -3px 0 #69df6f,
        34px -3px 0 3px #165923,
        78px 2px 0 #ff78b8,
        78px 2px 0 3px #7a1745;
      opacity:.75;
    }


    .temperature-controls {
      position:relative;
      z-index:2;
      margin-top:14px;
      padding:10px;
      background:#071920;
      border:3px solid #1f5366;
    }

    .temperature-controls-title {
      color:var(--fridge);
      font-size:11px;
      font-weight:900;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin-bottom:8px;
    }

    .temperature-buttons {
      display:grid;
      grid-template-columns:repeat(2, minmax(0, 1fr));
      gap:8px;
    }

    .temperature-buttons button {
      padding:10px 7px;
      border:3px solid #020506;
      font-family:"Courier New", monospace;
      font-weight:900;
      text-transform:uppercase;
      box-shadow:3px 3px 0 #020506;
      cursor:pointer;
    }

    .temp-cool { background:#bfefff; color:#06202b; }
    .temp-warm { background:#ffb14a; color:#321800; }
    .temp-archive { background:#d7e0e4; color:#172126; }
    .temp-stop { background:#ff7474; color:#330000; }

    .temp-message {
      min-height:18px;
      margin-top:9px;
      color:#dff8ff;
      font-size:12px;
      line-height:1.3;
    }

    @media (max-width:390px) {
      .toggle button { font-size:10px; }
      .fridge-shell { margin-top:2px; }
      .fridge-cavity { min-height:560px; }
      .fridge-inner { min-height:510px; }
      .fridge-name { font-size:21px; }
      .fridge-temp { font-size:18px; min-width:52px; }
    }

  </style>
</head>

<body>
<a class="back-arrow" href="index.html">←</a>

<div class="app">

  <div class="toggle">
    <button id="hotBtn" class="hotbtn" onclick="setMode('hot')">🌡 HOTLIST</button>
    <button id="stoveBtn" class="stovebtn" onclick="setMode('stove')">🔥 STOVETOP</button>
    <button id="fridgeBtn" class="fridgebtn" onclick="setMode('fridge')">
      <span class="pixel-fridge-icon" aria-hidden="true"></span>
      FRIDGE
    </button>
  </div>

  <div id="hotSection">
    <div id="hotStack" class="stack"></div>
  </div>

  <div id="stoveSection">
    <div id="stoveStack" class="stack"></div>
  </div>

  <div id="fridgeSection">
    <div class="fridge-shell">
      <div class="fridge-header">
        <span class="pixel-fridge-icon" aria-hidden="true"></span>
        Chismebot Refrigerator
        <span class="fridge-handle" aria-hidden="true"></span>
      </div>

      <div class="fridge-cavity">
        <div class="fridge-inner">
          <div class="fridge-light" aria-hidden="true"></div>
          <div class="pixel-food" aria-hidden="true"></div>
          <div id="fridgeStack"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pjquistiolcoqvcfmqjn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_SrGvJETp3Bpm9i9n1wGheQ_3Ni7FdIv";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let mode = "fridge";
let hotCards = [];
let stoveCards = [];
let fridgeCards = [];
let fridgeIndex = 0;
let fridgeLogs = {};

function esc(v) {
  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function contactLine(c) {
  const pieces = [];
  if (c?.phone) pieces.push(c.phone);
  if (c?.email) pieces.push(c.email);
  if (c?.address) pieces.push(c.address);
  return pieces.length ? pieces.join(" | ") : "No phone/email/address saved";
}

function setMode(m) {
  mode = m;

  document.getElementById("hotSection").style.display = (m === "hot") ? "block" : "none";
  document.getElementById("stoveSection").style.display = (m === "stove") ? "block" : "none";
  document.getElementById("fridgeSection").style.display = (m === "fridge") ? "block" : "none";

  document.getElementById("hotBtn").classList.toggle("active", m === "hot");
  document.getElementById("stoveBtn").classList.toggle("active", m === "stove");
  document.getElementById("fridgeBtn").classList.toggle("active", m === "fridge");
}

/* HOTLIST = customers at 51° or above who are not currently on the stovetop. */
async function loadHot() {
  const { data: activeRows, error: activeError } = await sb
    .from("chisme_active")
    .select("contact_id");

  if (activeError) {
    console.error("Active lookup for hotlist failed:", activeError);
    hotCards = [];
    return;
  }

  const activeIds = new Set((activeRows || []).map(r => r.contact_id));

  const { data, error } = await sb
    .from("chisme_contacts")
    .select("*")
    .gte("hotlist_temperature", 51)
    .or("do_not_pursue.is.null,do_not_pursue.eq.false")
    .order("hotlist_temperature", { ascending:false })
    .order("next_followup_date", { ascending:true });

  if (error) {
    console.error("Hotlist load failed:", error);
    hotCards = [];
    return;
  }

  hotCards = (data || []).filter(c => !activeIds.has(c.id));
}

/* STOVETOP = active table joined to contact card */
async function loadStove() {
  const { data, error } = await sb
    .from("chisme_active")
    .select(`
      id,
      contact_id,
      active_reason,
      burner_position,
      next_followup_date,
      active_owner,
      chisme_contacts (*)
    `)
    .order("burner_position", { ascending:true })
    .order("next_followup_date", { ascending:true });

  if (error) {
    console.error("Stovetop load failed:", error);
    stoveCards = [];
    return;
  }

  stoveCards = data || [];
}


function formatDate(value) {
  if (!value) return "";
  const d = new Date(value);
  if (Number.isNaN(d.getTime())) return String(value);
  return d.toLocaleDateString("en-US", {
    year:"numeric",
    month:"short",
    day:"numeric"
  });
}

/* REFRIGERATOR = paying past customers at 0–50° who are not on the stovetop. */
async function loadFridge() {
  const { data: activeRows, error: activeError } = await sb
    .from("chisme_active")
    .select("contact_id");

  if (activeError) {
    console.error("Refrigerator active lookup failed:", activeError);
    fridgeCards = [];
    fridgeLogs = {};
    return;
  }

  const activeIds = new Set((activeRows || []).map(r => r.contact_id));

  const { data, error } = await sb
    .from("chisme_contacts")
    .select("*")
    .gt("lifetime_value", 0)
    .or("do_not_pursue.is.null,do_not_pursue.eq.false")
    .gte("hotlist_temperature", 0)
    .lte("hotlist_temperature", 50)
    .order("hotlist_temperature", { ascending:false })
    .order("lifetime_value", { ascending:false })
    .limit(1000);

  if (error) {
    console.error("Refrigerator load failed:", error);
    fridgeCards = [];
    fridgeLogs = {};
    return;
  }

  fridgeCards = (data || []).filter(c =>
    !activeIds.has(c.id)
  );

  if (fridgeIndex >= fridgeCards.length) fridgeIndex = 0;

  const contactIds = fridgeCards.map(c => c.id).filter(Boolean);
  fridgeLogs = {};

  if (!contactIds.length) return;

  /*
    Chismebot stores one journal anchor per contact in chisme_journals,
    then stores the actual entries in chisme_notes.
  */
  const { data: journals, error: journalError } = await sb
    .from("chisme_journals")
    .select("id, contact_id")
    .in("contact_id", contactIds);

  if (journalError) {
    console.warn("Chisme journal lookup failed:", journalError);
    return;
  }

  const journalIds = (journals || []).map(j => j.id).filter(Boolean);
  const contactByJournal = Object.fromEntries(
    (journals || []).map(j => [j.id, j.contact_id])
  );

  if (!journalIds.length) return;

  const { data: notes, error: notesError } = await sb
    .from("chisme_notes")
    .select("*")
    .in("journal_id", journalIds)
    .order("created_at", { ascending:false });

  if (notesError) {
    console.warn("Chisme notes lookup failed:", notesError);
    return;
  }

  for (const note of notes || []) {
    const contactId = contactByJournal[note.journal_id];
    if (!contactId) continue;
    if (!fridgeLogs[contactId]) fridgeLogs[contactId] = [];
    fridgeLogs[contactId].push(note);
  }
}

async function loadProjectTasksForStove() {

  const contactIds = stoveCards
    .map(r => r.contact_id)
    .filter(Boolean);

  if (!contactIds.length) return;

  const { data, error } = await sb
    .from("metiche_project_tasks")
    .select("*")
    .in("contact_id", contactIds)
    .order("project_name")
    .order("sort_order")
    .order("created_at");

  if (error) {
    console.error(error);
    return;
  }

  const byContact = {};

  for (const task of data || []) {
    if (!byContact[task.contact_id]) {
      byContact[task.contact_id] = [];
    }
    byContact[task.contact_id].push(task);
  }

  stoveCards = stoveCards.map(card => ({
    ...card,
    project_tasks: byContact[card.contact_id] || []
  }));
}

function getProjectProgress(tasks) {

  const total = tasks.length;

  const done = tasks.filter(t => t.completed).length;

  return {
    total,
    done,
    percent: total
      ? Math.round(done / total * 100)
      : 0
  };
}

function renderHot() {
  const el = document.getElementById("hotStack");

  if (!hotCards.length) {
    el.innerHTML = `<div class="empty">No hot leads at 75° or above.</div>`;
    return;
  }

  el.innerHTML = hotCards.map(c => `
    <div class="card hot">
      <div class="banner">🌡 ${esc(c.hotlist_temperature ?? 0)}° LEAD</div>
      <div class="name">${esc(c.name || "Unknown")}</div>

      <div class="field"><b>Temperature:</b> ${esc(c.hotlist_temperature ?? 0)}°</div>
      <div class="field"><b>Phone:</b> ${esc(c.phone || "No phone saved")}</div>
      <div class="field"><b>Next action:</b> ${esc(c.next_action || "None")}</div>
      <div class="field"><b>Last outcome / chisme:</b> ${esc(c.last_outcome || c.chisme_summary || "No chisme logged")}</div>
      <div class="field"><b>Follow-up date:</b> ${esc(c.next_followup_date || c.next_contact_date || "None")}</div>
    </div>
  `).join("");
}

function groupTasksByProject(tasks) {
  const grouped = {};

  for (const task of tasks || []) {
    const project = task.project_name || "No project";
    if (!grouped[project]) grouped[project] = [];
    grouped[project].push(task);
  }

  return grouped;
}

function renderProjectBlock(projectName, tasks) {
  const progress = getProjectProgress(tasks);

  return `
    <div class="field"><b>Project:</b> ${esc(projectName)}</div>

    <div class="field">
      <b>Ready:</b> ${progress.percent}% (${progress.done}/${progress.total})
    </div>

    <div class="field"><b>Project Tasks</b></div>

    <div class="field">
      ${
        tasks.length
          ? tasks.map((t, i) =>
              `${t.completed ? "✅" : "⬜"} ${i + 1}. ${esc(t.task_text)}`
            ).join("<br>")
          : "<span class='muted'>No Metiche tasks.</span>"
      }
    </div>
  `;
}

function renderStove() {
  const el = document.getElementById("stoveStack");

  if (!stoveCards.length) {
    el.innerHTML = `<div class="empty">No projects on the stovetop.</div>`;
    return;
  }

  el.innerHTML = stoveCards.map(row => {
    const c = row.chisme_contacts || {};
    const tasks = row.project_tasks || [];
    const groupedProjects = groupTasksByProject(tasks);
    const projectNames = Object.keys(groupedProjects);

    const projectHtml = projectNames.length
      ? projectNames.map(projectName =>
          renderProjectBlock(projectName, groupedProjects[projectName])
        ).join(`<hr style="border:0;border-top:1px solid #333;margin:14px 0;">`)
      : `
        <div class="field"><b>Project:</b> No project</div>
        <div class="field muted">No Metiche tasks yet.</div>
      `;

    return `
      <div class="card stove">
        <div class="banner">🔥 BURNER ${esc(row.burner_position || "?")}</div>

        <div class="name">${esc(c.name || "Unknown")}</div>
        <div class="meta">${esc(contactLine(c))}</div>

        ${projectHtml}

        <div class="field" style="margin-top:18px;">
          <b>Project Notes</b>
        </div>

        <details class="field" style="margin-top:8px;">
          <summary
            style="
              cursor:pointer;
              color:#ff6a00;
              font-weight:bold;
              list-style:none;
              outline:none;
            ">
            📝 Project Notes
          </summary>
        
          <div
            class="muted"
            style="
              margin-top:10px;
              padding:10px;
              background:#111;
              border:1px solid #333;
              border-radius:6px;
              white-space:pre-wrap;
            ">
            ${esc(c.chisme_summary || "No project notes yet.")}
          </div>
        </details>
      </div>
    `;
  }).join("");
}


function currentFridgeCustomer() {
  return fridgeCards[fridgeIndex] || null;
}

function renderFridge() {
  const el = document.getElementById("fridgeStack");
  const c = currentFridgeCustomer();

  if (!c) {
    el.innerHTML = `
      <div class="customer-fridge-card">
        <div class="fridge-card-top">
          <div class="fridge-name">Refrigerator empty</div>
          <div class="fridge-temp">0°</div>
        </div>
        <div class="chisme-log">
          <div class="chisme-log-title">Chisme log</div>
          <div class="chisme-entry">No customers are currently queued.</div>
        </div>
      </div>
    `;
    return;
  }

  const logs = fridgeLogs[c.id] || [];
  const fallback = c.chisme_summary || c.notes || "";

  const logHtml = logs.length
    ? logs.map(log => {
        const text =
          log.note_text ||
          log.journal ||
          log.entry ||
          log.notes ||
          log.title ||
          "";
        return `
          <div class="chisme-entry">
            ${log.note_date || log.created_at
              ? `<span class="chisme-date">${esc(formatDate(log.note_date || log.created_at))}</span>`
              : ""}
            ${esc(text || "Chisme entry saved.")}
          </div>
        `;
      }).join("")
    : `
      <div class="chisme-entry">
        ${esc(fallback || "No chisme logged yet.")}
      </div>
    `;

  el.innerHTML = `
    <div class="customer-fridge-card">
      <div class="fridge-card-top">
        <div class="fridge-name">${esc(c.name || "Unknown")}</div>
        <div class="fridge-temp">${esc(c.hotlist_temperature ?? 0)}°</div>
      </div>

      <div class="fridge-contact">
        <div class="fridge-contact-row">
          <b>Phone</b>
          ${esc(c.phone || "No phone saved")}
        </div>

        <div class="fridge-contact-row">
          <b>Email</b>
          ${esc(c.email || "No email saved")}
        </div>

        <div class="fridge-contact-row">
          <b>Address</b>
          ${esc(c.address || "No address saved")}
        </div>

        <div class="fridge-contact-row">
          <b>Customer history</b>
          Lifetime value: ${esc(Number(c.lifetime_value || 0).toLocaleString("en-US", {
            style:"currency",
            currency:"USD",
            maximumFractionDigits:0
          }))}<br>
          Last service: ${esc(formatDate(c.last_service_date) || "Unknown")}
        </div>
      </div>

      <div class="chisme-log">
        <div class="chisme-log-title">Chisme log</div>
        ${logHtml}
      </div>

      <div class="temperature-controls">
        <div class="temperature-controls-title">Adjust temperature</div>

        <div class="temperature-buttons">
          <button class="temp-cool" onclick="changeTemperature(-10)">Cool -10°</button>
          <button class="temp-warm" onclick="changeTemperature(10)">Warm +10°</button>
          <button class="temp-archive" onclick="setTemperature(0, false)">Archive 0°</button>
          <button class="temp-stop" onclick="setTemperature(-10, true)">Do not pursue -10°</button>
        </div>

        <div id="tempMessage" class="temp-message"></div>
      </div>
    </div>

    <div class="fridge-nav">
      <button onclick="previousFridgeCustomer()">◀ Previous</button>
      <button onclick="nextFridgeCustomer()">Next ▶</button>
    </div>

    <div class="fridge-counter">
      Customer ${fridgeIndex + 1} of ${fridgeCards.length}
    </div>
  `;
}


function showTempMessage(message) {
  const el = document.getElementById("tempMessage");
  if (el) el.textContent = message || "";
}

async function saveCustomerTemperature(c, temperature, doNotPursue) {
  showTempMessage("Saving...");

  const { error } = await sb
    .from("chisme_contacts")
    .update({
      hotlist_temperature:temperature,
      do_not_pursue:doNotPursue
    })
    .eq("id", c.id);

  if (error) {
    console.error("Temperature update failed:", error);
    showTempMessage("Could not save temperature.");
    return false;
  }

  return true;
}

async function changeTemperature(amount) {
  const c = currentFridgeCustomer();
  if (!c) return;

  const current = Number(c.hotlist_temperature || 0);
  const next = Math.max(-10, Math.min(100, current + amount));
  const doNotPursue = next === -10;

  const saved = await saveCustomerTemperature(c, next, doNotPursue);
  if (!saved) return;

  if (next > 50 || next < 0 || doNotPursue) {
    fridgeCards.splice(fridgeIndex, 1);
    if (fridgeIndex >= fridgeCards.length) fridgeIndex = 0;
    await loadHot();
    renderHot();
    renderFridge();
    return;
  }

  c.hotlist_temperature = next;
  c.do_not_pursue = false;
  renderFridge();
  showTempMessage(`Temperature saved at ${next}°.`);
}

async function setTemperature(value, doNotPursue) {
  const c = currentFridgeCustomer();
  if (!c) return;

  const saved = await saveCustomerTemperature(c, value, doNotPursue);
  if (!saved) return;

  if (value < 0 || doNotPursue) {
    fridgeCards.splice(fridgeIndex, 1);
    if (fridgeIndex >= fridgeCards.length) fridgeIndex = 0;
    renderFridge();
    return;
  }

  c.hotlist_temperature = value;
  c.do_not_pursue = false;
  renderFridge();
  showTempMessage(`Temperature saved at ${value}°.`);
}

function previousFridgeCustomer() {
  if (!fridgeCards.length) return;
  fridgeIndex = (fridgeIndex - 1 + fridgeCards.length) % fridgeCards.length;
  renderFridge();
}

function nextFridgeCustomer() {
  if (!fridgeCards.length) return;
  fridgeIndex = (fridgeIndex + 1) % fridgeCards.length;
  renderFridge();
}

async function loadAll() {
  await Promise.all([loadHot(), loadStove(), loadFridge()]);
  await loadProjectTasksForStove();
  renderHot();
  renderStove();
  renderFridge();
  setMode(mode);
}
  
loadAll();
setInterval(loadAll, 60000);
</script>
