<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chismebot Customer Communication</title>
  <style>
    :root {
      --bg: #11100f;
      --card: #f7f0df;
      --ink: #211b16;
      --muted: #6f6257;
      --line: #d6c6aa;
      --button: #2b2520;
      --button-text: #fff8eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
    }

    .phone-shell {
      width: 100%;
      max-width: 430px;
      min-height: 92vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    header {
      color: #f7f0df;
      text-align: center;
      padding: 6px 0 2px;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.78rem;
      color: #cdbf9f;
    }

    .card-wrap {
      flex: 1;
      display: flex;
      align-items: stretch;
    }

    .index-card {
      width: 100%;
      background: var(--card);
      border-radius: 18px;
      padding: 20px 18px 18px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.16);
      display: flex;
      flex-direction: column;
      min-height: 670px;
    }

    .card-top {
      border-bottom: 2px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .name {
      font-size: 1.75rem;
      line-height: 1.05;
      font-weight: 800;
      margin: 0 0 10px;
      letter-spacing: -0.03em;
    }

    .contact {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--muted);
    }

    .section {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .section:last-of-type {
      border-bottom: 0;
    }

    .label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .text {
      font-size: 1rem;
      line-height: 1.38;
      margin: 0;
    }

    .address {
      margin-top: auto;
      padding-top: 14px;
      border-top: 2px solid var(--line);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 10px;
    }

    button {
      border: 0;
      background: var(--button);
      color: var(--button-text);
      border-radius: 999px;
      padding: 13px 16px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .counter {
      color: #f7f0df;
      font-size: 0.85rem;
      font-weight: 700;
      min-width: 58px;
      text-align: center;
    }

    .hint {
      color: #a89a80;
      text-align: center;
      font-size: 0.74rem;
      margin: 0 0 4px;
    }

    @media (max-height: 760px) {
      body { align-items: flex-start; }
      .index-card { min-height: auto; }
      .phone-shell { min-height: auto; }
      .name { font-size: 1.55rem; }
      .section { padding: 8px 0; }
      .text { font-size: 0.95rem; }
    }
  </style>
</head>
<body>
  <main class="phone-shell">
    <header>
      <h1>Customer Communication</h1>
      <p>Chismebot index cards</p>
    </header>

    <section class="card-wrap" aria-live="polite">
      <article class="index-card" id="card">
        <div class="card-top">
          <h2 class="name" id="name"></h2>
          <div class="contact">
            <div id="phone"></div>
            <div id="email"></div>
          </div>
        </div>

        <div class="section">
          <div class="label">Status</div>
          <p class="text" id="status"></p>
        </div>

        <div class="section">
          <div class="label">Current Chisme</div>
          <p class="text" id="currentChisme"></p>
        </div>

        <div class="section">
          <div class="label">History</div>
          <p class="text" id="history"></p>
        </div>

        <div class="section">
          <div class="label">Taste / Customer Profile</div>
          <p class="text" id="taste"></p>
        </div>

        <div class="address">
          <div class="label">Address</div>
          <p class="text" id="address"></p>
        </div>
      </article>
    </section>

    <div class="controls">
      <button id="prevBtn" type="button">Previous</button>
      <div class="counter" id="counter"></div>
      <button id="nextBtn" type="button">Next</button>
    </div>
    <p class="hint">Swipe card or use buttons</p>
  </main>

  <script>
    const customers = [
      {
        name: "Michael Lawrence",
        phone: "210-555-1234",
        email: "michael@example.com",
        status: "Estimate pending — bathroom refresh / shower door update.",
        currentChisme: "Shower door will not close properly. Shower area looks worn, calcified, and slightly rusted. Wants the repair to solve the function problem and clean up the look.",
        history: "Past customer. Hired us to redo his garage after recovering from an injury and going through a painful divorce. Wanted the garage as a clean CrossFit-style workout space where neighbors could also join him.",
        taste: "Minimalist, very neat and clean. Masculine / art deco feel. Likes gray, black, marble, and updates that make aging parts of the house look intentional and sharp again.",
        address: "123 Main St\nSan Antonio, TX"
      },
      {
        name: "Andy Holland / Yvette Smith",
        phone: "210-555-5678",
        email: "andy-yvette@example.com",
        status: "Active projects — Gardina and Bryn Mawr.",
        currentChisme: "Daniel needs to coordinate CPS temporary power for Gardina. Bryn Mawr panel work needs correction and power restoration. Rough-in inspection path needs coordination with subcontractor and city.",
        history: "Multi-property construction / permit-heavy customer relationship. Communication often involves the customer, CPS, city inspections, and subcontractors rather than only direct customer calls.",
        taste: "Needs clear updates, steady project control, and fewer surprises. Keep communication tied to inspection readiness, power restoration, and next visible milestone.",
        address: "1211 Gardina / Bryn Mawr Duplex\nSan Antonio, TX"
      },
      {
        name: "Kate Pyle",
        phone: "210-555-9012",
        email: "kate@example.com",
        status: "Scheduled work — Wednesday, Thursday, Friday.",
        currentChisme: "Customer says she has enough work to keep Daniel busy this week. Need to protect schedule and keep updates clean as work progresses.",
        history: "Active customer with ongoing work. Current value is in keeping the work moving smoothly and communicating progress without overcomplicating the day.",
        taste: "Practical communication. Wants work handled and schedule respected.",
        address: "Address pending"
      }
    ];

    let index = 0;
    const ids = ["name", "phone", "email", "status", "currentChisme", "history", "taste", "address", "counter"];
    const el = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));

    function renderCard() {
      const c = customers[index];
      el.name.textContent = c.name;
      el.phone.textContent = c.phone;
      el.email.textContent = c.email;
      el.status.textContent = c.status;
      el.currentChisme.textContent = c.currentChisme;
      el.history.textContent = c.history;
      el.taste.textContent = c.taste;
      el.address.textContent = c.address;
      el.counter.textContent = `${index + 1} / ${customers.length}`;
    }

    function nextCard() {
      index = (index + 1) % customers.length;
      renderCard();
    }

    function prevCard() {
      index = (index - 1 + customers.length) % customers.length;
      renderCard();
    }

    document.getElementById("nextBtn").addEventListener("click", nextCard);
    document.getElementById("prevBtn").addEventListener("click", prevCard);

    let startX = 0;
    const card = document.getElementById("card");
    card.addEventListener("touchstart", e => {
      startX = e.changedTouches[0].screenX;
    }, { passive: true });

    card.addEventListener("touchend", e => {
      const endX = e.changedTouches[0].screenX;
      const delta = endX - startX;
      if (Math.abs(delta) > 45) {
        delta < 0 ? nextCard() : prevCard();
      }
    }, { passive: true });

    renderCard();
  </script>
</body>
</html>
