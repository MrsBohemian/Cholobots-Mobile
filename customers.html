<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chismebot Customer Cards</title>

  <style>
    :root {
      --bg:#000;
      --card:#1b1b1b;
      --border:#333;
      --text:#eee;
      --muted:#9a9a9a;
      --hot:#ff6a00;
      --stove:#ff2d2d;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    .app {
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    /* Toggle */
    .toggle {
      display:flex;
      gap:10px;
    }

    .toggle button {
      flex:1;
      padding:12px;
      background:#111;
      border:1px solid var(--border);
      color:var(--text);
      font-weight:700;
    }

    .section-title {
      margin-top:10px;
      font-weight:800;
      letter-spacing:0.05em;
      color:var(--muted);
    }

    /* Stacks */
    .stack {
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card {
      background:var(--card);
      border:1px solid var(--border);
      padding:12px;
    }

    .name {
      font-size:20px;
      font-weight:800;
      margin-bottom:6px;
    }

    .meta {
      color:var(--muted);
      font-size:13px;
      margin-bottom:8px;
    }

    .banner {
      font-weight:800;
      padding:6px 10px;
      margin:-12px -12px 10px -12px;
      border-bottom:1px solid var(--border);
    }

    .hot .banner {
      background:rgba(255,106,0,0.15);
      color:var(--hot);
      border-bottom:1px solid var(--hot);
    }

    .stove .banner {
      background:rgba(255,45,45,0.15);
      color:var(--stove);
      border-bottom:1px solid var(--stove);
    }

    .field {
      font-size:13px;
      margin:4px 0;
      color:#ddd;
    }

    .muted { color:var(--muted); }
  </style>
</head>

<body>
<div class="app">

  <div class="toggle">
    <button onclick="setMode('hot')">🌡 HOTLIST</button>
    <button onclick="setMode('stove')">🔥 STOVETOP</button>
  </div>

  <div id="hotSection">
    <div class="section-title">HOTLIST</div>
    <div id="hotStack" class="stack"></div>
  </div>

  <div id="stoveSection">
    <div class="section-title">STOVETOP</div>
    <div id="stoveStack" class="stack"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pjquistiolcoqvcfmqjn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_SrGvJETp3Bpm9i9n1wGheQ_3Ni7FdIv";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let mode = "hot";
let hotCards = [];
let stoveCards = [];

function setMode(m) {
  mode = m;

  document.getElementById("hotSection").style.display = (m === "hot") ? "block" : "none";
  document.getElementById("stoveSection").style.display = (m === "stove") ? "block" : "none";
}

/* ---------------- HOTLIST ---------------- */
async function loadHot() {
  const { data } = await sb
    .from("chisme_contacts")
    .select("*")
    .gt("lead_temperature", 0)
    .order("lead_temperature", { ascending:false });

  hotCards = data || [];
}

/* ---------------- STOVETOP ---------------- */
async function loadStove() {
  const { data } = await sb
    .from("chisme_contacts")
    .select("*")
    .not("burner_position", "is", null)
    .order("burner_position", { ascending:true });

  stoveCards = data || [];
}

/* ---------------- RENDER ---------------- */

function renderHot() {
  const el = document.getElementById("hotStack");

  el.innerHTML = hotCards.map(c => `
    <div class="card hot">
      <div class="banner">🌡 HOTLIST — ${c.lead_temperature || 0}°</div>
      <div class="name">${c.name || "Unknown"}</div>
      <div class="meta">${c.phone || ""} ${c.email ? " | " + c.email : ""}</div>

      <div class="field"><b>Next:</b> ${c.next_followup_date || "None"}</div>
      <div class="field"><b>Reason:</b> ${c.active_reason || "None"}</div>
      <div class="field muted">${c.last_outcome || ""}</div>
    </div>
  `).join("");
}

function renderStove() {
  const el = document.getElementById("stoveStack");

  el.innerHTML = stoveCards.map(c => `
    <div class="card stove">
      <div class="banner">🔥 STOVETOP — Burner ${c.burner_position}</div>
      <div class="name">${c.name || "Unknown"}</div>
      <div class="meta">${c.phone || ""} ${c.email ? " | " + c.email : ""}</div>

      <div class="field"><b>Active:</b> ${c.active_reason || "None"}</div>
      <div class="field"><b>Next:</b> ${c.next_action || "None"}</div>
      <div class="field muted">${c.chisme_summary || ""}</div>
    </div>
  `).join("");
}

/* ---------------- LOAD ---------------- */

async function loadAll() {
  await Promise.all([loadHot(), loadStove()]);
  renderHot();
  renderStove();
  setMode("hot");
}

loadAll();
setInterval(loadAll, 60000);
</script>

</body>
</html>
