<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chismebot Customer Cards</title>

  <style>
    :root {
      --bg:#000; --card:#1b1b1b; --border:#333;
      --text:#eee; --muted:#9a9a9a;
      --hot:#ff6a00; --stove:#ff2d2d;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:Arial, Helvetica, sans-serif;
    }

    .back-arrow {
      position: fixed;
      top: 14px;
      left: 16px;
      font-size: 32px;
      color: white;
      text-decoration: none;
      z-index: 9999;
    }
    
    .app {
      min-height:100dvh;
      padding:56px 10px 10px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .toggle {
      display:flex;
      gap:10px;
      position:sticky;
      top:0;
      background:#000;
      padding-bottom:6px;
      z-index:5;
    }

    .toggle button {
      flex:1;
      padding:12px;
      background:#111;
      border:1px solid var(--border);
      color:var(--text);
      font-weight:800;
      font-size:15px;
    }

    .toggle button.active.hotbtn {
      border-color:var(--hot);
      color:var(--hot);
    }

    .toggle button.active.stovebtn {
      border-color:var(--stove);
      color:var(--stove);
    }

    .section-title {
      margin:8px 0 4px;
      font-weight:900;
      letter-spacing:0.08em;
      color:var(--muted);
      font-size:18px;
    }

    .stack {
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card {
      background:var(--card);
      border:1px solid var(--border);
      padding:12px;
    }

    .banner {
      font-weight:900;
      padding:8px 10px;
      margin:-12px -12px 12px -12px;
      border-bottom:1px solid var(--border);
      letter-spacing:0.03em;
    }

    .hot .banner {
      background:rgba(255,106,0,0.16);
      color:var(--hot);
      border-bottom-color:var(--hot);
    }

    .stove .banner {
      background:rgba(255,45,45,0.16);
      color:var(--stove);
      border-bottom-color:var(--stove);
    }

    .name {
      font-size:24px;
      font-weight:900;
      margin-bottom:8px;
      line-height:1.05;
    }

    .meta {
      color:var(--muted);
      font-size:14px;
      margin-bottom:10px;
      line-height:1.35;
      word-break:break-word;
    }

    .field {
      font-size:15px;
      margin:6px 0;
      color:#ddd;
      line-height:1.3;
    }

    .muted { color:var(--muted); }

    .empty {
      color:var(--muted);
      border:1px solid var(--border);
      padding:18px;
      background:#111;
      line-height:1.35;
    }
    
  </style>
</head>

<body>
<a class="back-arrow" href="index.html">←</a>

<div class="app">

  <div class="toggle">
    <button id="hotBtn" class="hotbtn" onclick="setMode('hot')">🌡 HOTLIST</button>
    <button id="stoveBtn" class="stovebtn" onclick="setMode('stove')">🔥 STOVETOP</button>
  </div>

  <div id="hotSection">
    <div class="section-title">HOT LIST — LEAD COMMUNICATION</div>
    <div id="hotStack" class="stack"></div>
  </div>

  <div id="stoveSection">
    <div class="section-title">STOVETOP</div>
    <div id="stoveStack" class="stack"></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pjquistiolcoqvcfmqjn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_SrGvJETp3Bpm9i9n1wGheQ_3Ni7FdIv";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let mode = "hot";
let hotCards = [];
let stoveCards = [];

function esc(v) {
  return String(v ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function contactLine(c) {
  const pieces = [];
  if (c?.phone) pieces.push(c.phone);
  if (c?.email) pieces.push(c.email);
  if (c?.address) pieces.push(c.address);
  return pieces.length ? pieces.join(" | ") : "No phone/email/address saved";
}

function setMode(m) {
  mode = m;

  document.getElementById("hotSection").style.display = (m === "hot") ? "block" : "none";
  document.getElementById("stoveSection").style.display = (m === "stove") ? "block" : "none";

  document.getElementById("hotBtn").classList.toggle("active", m === "hot");
  document.getElementById("stoveBtn").classList.toggle("active", m === "stove");
}

/* HOTLIST = hot leads only: 75+ and NOT currently on stovetop */
async function loadHot() {
  const { data: activeRows, error: activeError } = await sb
    .from("chisme_active")
    .select("contact_id");

  if (activeError) {
    console.error("Active lookup for hotlist failed:", activeError);
    hotCards = [];
    return;
  }

  const activeIds = new Set((activeRows || []).map(r => r.contact_id));

  const { data, error } = await sb
    .from("chisme_contacts")
    .select("*")
    .gte("lead_temperature", 75)
    .order("lead_temperature", { ascending:false })
    .order("next_followup_date", { ascending:true });

  if (error) {
    console.error("Hotlist load failed:", error);
    hotCards = [];
    return;
  }

  hotCards = (data || []).filter(c => !activeIds.has(c.id));
}

/* STOVETOP = active table joined to contact card */
async function loadStove() {
  const { data, error } = await sb
    .from("chisme_active")
    .select(`
      id,
      contact_id,
      active_reason,
      burner_position,
      next_followup_date,
      active_owner,
      chisme_contacts (*)
    `)
    .order("burner_position", { ascending:true })
    .order("next_followup_date", { ascending:true });

  if (error) {
    console.error("Stovetop load failed:", error);
    stoveCards = [];
    return;
  }

  stoveCards = data || [];
}

async function loadProjectTasksForStove() {

  const contactIds = stoveCards
    .map(r => r.contact_id)
    .filter(Boolean);

  if (!contactIds.length) return;

  const { data, error } = await sb
    .from("metiche_project_tasks")
    .select("*")
    .in("contact_id", contactIds)
    .order("project_name")
    .order("sort_order")
    .order("created_at");

  if (error) {
    console.error(error);
    return;
  }

  const byContact = {};

  for (const task of data || []) {
    if (!byContact[task.contact_id]) {
      byContact[task.contact_id] = [];
    }
    byContact[task.contact_id].push(task);
  }

  stoveCards = stoveCards.map(card => ({
    ...card,
    project_tasks: byContact[card.contact_id] || []
  }));
}

function getProjectProgress(tasks) {

  const total = tasks.length;

  const done = tasks.filter(t => t.completed).length;

  return {
    total,
    done,
    percent: total
      ? Math.round(done / total * 100)
      : 0
  };
}

function renderHot() {
  const el = document.getElementById("hotStack");

  if (!hotCards.length) {
    el.innerHTML = `<div class="empty">No hot leads at 75° or above.</div>`;
    return;
  }

  el.innerHTML = hotCards.map(c => `
    <div class="card hot">
      <div class="banner">🌡 ${esc(c.lead_temperature || 0)}° LEAD</div>
      <div class="name">${esc(c.name || "Unknown")}</div>

      <div class="field"><b>Temperature:</b> ${esc(c.lead_temperature || 0)}°</div>
      <div class="field"><b>Phone:</b> ${esc(c.phone || "No phone saved")}</div>
      <div class="field"><b>Next action:</b> ${esc(c.next_action || "None")}</div>
      <div class="field"><b>Last outcome / chisme:</b> ${esc(c.last_outcome || c.chisme_summary || "No chisme logged")}</div>
      <div class="field"><b>Follow-up date:</b> ${esc(c.next_followup_date || c.next_contact_date || "None")}</div>
    </div>
  `).join("");
}

function renderStove() {
  const el = document.getElementById("stoveStack");

  if (!stoveCards.length) {
    el.innerHTML = `<div class="empty">No projects on the stovetop.</div>`;
    return;
  }

  el.innerHTML = stoveCards.map(row => {
    const c = row.chisme_contacts || {};
    const tasks = row.project_tasks || [];
    const progress = getProjectProgress(tasks);
    const projectName = tasks[0]?.project_name || "No project";
    return `
      <div class="card stove">
        <div class="banner">🔥 STOVETOP — Burner ${esc(row.burner_position || 4)}</div>
        <div class="name">${esc(c.name || "Unknown")}</div>
        <div class="meta">${esc(contactLine(c))}</div>

        <div class="field"><b>Project:</b> ${esc(projectName)}</div>

        <div class="field">
        <b>Ready:</b>
        ${progress.percent}% (${progress.done}/${progress.total})
        </div>
        
        <div class="field"><b>Honey-do List</b></div>
        
        <div class="field">
        ${
        tasks.length
        ? tasks.map((t,i)=>
        `${t.completed ? "✅" : "⬜"} ${i+1}. ${esc(t.task_text)}`
        ).join("<br>")
        : "<span class='muted'>No Metiche tasks.</span>"
        }
        </div>
        
        <div class="field muted">${esc(c.last_outcome || "")}</div>
      </div>
    `;
  }).join("");
}

async function loadAll() {
  await Promise.all([loadHot(), loadStove()]);
  await loadProjectTasksForStove();
  renderHot();
  renderStove();
  setMode(mode);
}

loadAll();
setInterval(loadAll, 60000);
</script>

</body>
</html>
