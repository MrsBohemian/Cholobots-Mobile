<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chismebot Customer Cards</title>
  <style>
    :root {
      --bg:#000; --card:#1b1b1b; --card-border:#3a3a3a;
      --text:#eeeeee; --muted:#9b9b9b; --strong:#ffffff;
      --line:#303030; --button:#252525; --button-border:#464646;
    }
    * { box-sizing:border-box; }
    html, body {
      margin:0; padding:0; width:100%; height:100%;
      background:var(--bg); color:var(--text);
      font-family:Arial, Helvetica, sans-serif; overflow:hidden;
    }
    body { display:flex; align-items:stretch; justify-content:center; }
    .app {
      width:100vw; height:100dvh;
      padding:max(6px, env(safe-area-inset-top)) 7px max(7px, env(safe-area-inset-bottom));
      display:grid; grid-template-rows:1fr auto; gap:6px;
      background:var(--bg);
    }
    .card-shell {
      min-height:0; border:1px solid var(--card-border);
      background:var(--card); overflow:hidden;
      display:flex; flex-direction:column;
    }
    .card {
      min-height:0; overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:15px 15px 18px;
    }
    .name {
      margin:0 0 5px; color:var(--strong);
      font-size:clamp(27px, 8vw, 38px);
      line-height:1.02; font-weight:800; letter-spacing:-0.04em;
    }
    .contact {
      color:#c9c9c9; font-size:clamp(13px, 3.8vw, 17px);
      line-height:1.28; margin-bottom:13px; word-break:break-word;
    }
    .section {
      padding-top:10px; margin-top:10px;
      border-top:1px solid var(--line);
    }
    .label {
      margin:0 0 4px; color:var(--muted);
      font-size:11px; line-height:1;
      letter-spacing:0.08em; text-transform:lowercase; font-weight:700;
    }
    .value {
      margin:0; color:var(--text);
      font-size:clamp(15px, 4.2vw, 18px);
      line-height:1.32; font-weight:400;
      white-space:pre-wrap;
    }
    .nav {
      height:43px; display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center; gap:7px;
    }
    button {
      height:40px; border:1px solid var(--button-border);
      background:var(--button); color:var(--strong);
      font-size:15px; font-weight:700;
      font-family:inherit; border-radius:0;
      touch-action:manipulation;
    }
    button:active { transform:translateY(1px); }
    .count {
      min-width:62px; text-align:center;
      color:#d6d6d6; font-size:14px; font-weight:700;
    }
    .empty {
      color:var(--muted);
      padding:18px;
      font-size:18px;
      line-height:1.35;
    }
  </style>
</head>

<body>
  <main class="app" aria-label="Customer communication index card viewer">
    <section class="card-shell">
      <article class="card" id="card" aria-live="polite"></article>
    </section>

    <nav class="nav" aria-label="Card navigation">
      <button id="prev" type="button">← Prev</button>
      <div class="count" id="count">0 / 0</div>
      <button id="next" type="button">Next →</button>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://pjquistiolcoqvcfmqjn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_SrGvJETp3Bpm9i9n1wGheQ_3Ni7FdIv";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let customers = [];
    let index = 0;

    const card = document.getElementById("card");
    const count = document.getElementById("count");
    const prev = document.getElementById("prev");
    const next = document.getElementById("next");

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function fallback(value, fallbackText = "Not saved") {
      return value && String(value).trim() ? value : fallbackText;
    }

    function section(label, value) {
      return `
        <section class="section">
          <p class="label">${escapeHtml(label)}</p>
          <p class="value">${escapeHtml(fallback(value, "None"))}</p>
        </section>
      `;
    }

    function render() {
      if (!customers.length) {
        card.innerHTML = `
          <div class="empty">
            No active customer communication cards.<br><br>
            Use <strong>!cactive Name | reason</strong> in Discord to add one.
          </div>
        `;
        count.textContent = "0 / 0";
        return;
      }

      if (index >= customers.length) index = 0;

      const c = customers[index];
      card.scrollTop = 0;

      const contactLine = [
        fallback(c.phone, ""),
        fallback(c.email, "")
      ].filter(Boolean).join(" | ") || "No phone/email saved";

      card.innerHTML = `
        <h1 class="name">${escapeHtml(c.name || "Unknown")}</h1>
        <div class="contact">${escapeHtml(contactLine)}</div>

        ${section("active reason", c.active_reason)}
        ${section("status", c.status)}
        ${section("next follow-up", c.next_followup_date || c.next_contact_date)}
        ${section("current chisme", c.chisme_summary)}
        ${section("last outcome", c.last_outcome)}
        ${section("next action", c.next_action)}
        ${section("address", c.address)}
        ${section("preferred contact", c.preferred_contact)}
      `;

      count.textContent = `${index + 1} / ${customers.length}`;
    }

    function go(delta) {
      if (!customers.length) return;
      index = (index + delta + customers.length) % customers.length;
      render();
    }

    async function loadCards() {
      card.innerHTML = `<div class="empty">Loading Chismebot cards…</div>`;

      const { data, error } = await supabaseClient
        .from("chisme_contacts")
        .select(`
          id,
          name,
          phone,
          email,
          address,
          status,
          preferred_contact,
          chisme_summary,
          last_outcome,
          next_action,
          next_contact_date,
          next_followup_date,
          active_reason,
          active_priority,
          active_since,
          active_owner
        `)
        .eq("active_communication", true)
        .order("active_priority", { ascending: true })
        .order("next_followup_date", { ascending: true });

      if (error) {
        console.error("Chismebot cards load failed:", error);
        card.innerHTML = `<div class="empty">Could not load Chismebot cards.</div>`;
        count.textContent = "error";
        return;
      }

      customers = data || [];
      index = 0;
      render();
    }

    prev.addEventListener("click", () => go(-1));
    next.addEventListener("click", () => go(1));

    let startX = null;

    card.addEventListener("touchstart", (e) => {
      startX = e.changedTouches[0].clientX;
    }, { passive: true });

    card.addEventListener("touchend", (e) => {
      if (startX === null) return;
      const endX = e.changedTouches[0].clientX;
      const diff = endX - startX;

      if (Math.abs(diff) > 55) {
        go(diff < 0 ? 1 : -1);
      }

      startX = null;
    }, { passive: true });

    loadCards();
    setInterval(loadCards, 60000);
  </script>
</body>
</html>
