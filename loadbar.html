<title>Cholobots Load Bars</title>
<style>
:root{
  --bg:#000; --panel:#111; --card:#181818; --border:#333;
  --text:#eee; --muted:#999; --orange:#ff6a00; --red:#ff2d2d;
  --green:#75d64b; --blue:#18a8ff; --yellow:#ffd166; --purple:#b76cff;
}
*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.back-arrow{
  position:fixed;
  top:12px;
  left:14px;
  font-size:38px;
  color:white;
  text-decoration:none;
  z-index:99;
  opacity:.9;
}

.app{
  min-height:100dvh;
  padding:58px 6px 22px;
  display:flex;
  flex-direction:column;
  gap:18px;
  width:100%;
  max-width:none;
  margin:0 auto;
}

.header{
  border:1px solid var(--border);
  background:linear-gradient(180deg,#171717,#0b0b0b);
  padding:22px;
}

h1{
  margin:0;
  font-size:34px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--orange);
}

.sub{
  margin-top:10px;
  color:var(--muted);
  font-size:18px;
  line-height:1.3;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  padding:22px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
}

.title{
  font-size:24px;
  font-weight:900;
  letter-spacing:.04em;
  text-transform:uppercase;
}

.score{
  font-size:38px;
  font-weight:900;
  white-space:nowrap;
}

.hint{
  color:var(--muted);
  font-size:18px;
  line-height:1.3;
  margin-top:8px;
}

.bar-wrap{
  height:52px;
  background:#050505;
  border:1px solid var(--border);
  margin:18px 0 12px;
  overflow:hidden;
}

.bar{
  height:100%;
  width:0%;
  transition:width .25s ease;
  background:var(--orange);
}

.meta{
  display:flex;
  justify-content:space-between;
  gap:10px;
  color:var(--muted);
  font-size:18px;
}

.orange .bar{background:linear-gradient(90deg,#7a3300,var(--orange))}
.red .bar{background:linear-gradient(90deg,#5f0000,var(--red))}
.green .bar{background:linear-gradient(90deg,#255d12,var(--green))}
.blue .bar{background:linear-gradient(90deg,#063c5f,var(--blue))}
.yellow .bar{background:linear-gradient(90deg,#6b4c00,var(--yellow))}
.purple .bar{background:linear-gradient(90deg,#3d155f,var(--purple))}

.wins{
  background:var(--panel);
  border:1px solid var(--border);
  padding:20px;
}

.wins h2{
  font-size:22px;
  margin:0 0 14px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--muted);
}

.win{
  border-top:1px solid #2a2a2a;
  padding:14px 0;
  font-size:20px;
  line-height:1.35;
}

.win:first-of-type{border-top:0}
.win b{color:#fff}

.empty{
  color:var(--muted);
  padding:16px;
  background:#0b0b0b;
  border:1px dashed var(--border);
  font-size:20px;
}

.error{
  color:#ffb3b3;
  white-space:pre-wrap;
}

.footer{
  color:var(--muted);
  font-size:16px;
  line-height:1.4;
  padding:4px;
}

@media (min-width:1100px){
  .app{
    max-width:980px;
    padding-left:18px;
    padding-right:18px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
  }

  .customer{
    grid-column:1 / -1;
  }
}
</style>
