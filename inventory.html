<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Guardabot Garage Map</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --gold: #ffbf2f;
      --panel: rgba(8, 12, 18, .94);
      --line: rgba(255, 255, 255, .22);
      --text: #f5f7fa;
      --muted: #aab3c0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #05070a;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
      background: rgba(5, 7, 10, .94);
      border-bottom: 1px solid #202734;
      backdrop-filter: blur(8px);
    }

    .back {
      color: var(--gold);
      text-decoration: none;
      font-size: 24px;
      line-height: 1;
    }

    .title {
      min-width: 0;
    }

    .title strong {
      display: block;
      color: var(--gold);
      letter-spacing: .08em;
      font-size: 15px;
    }

    .title span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .wrap {
      width: min(100%, 1100px);
      margin: 0 auto;
      padding: 12px 10px 28px;
    }

    .map-shell {
      position: relative;
      width: 100%;
      aspect-ratio: 1280 / 1184;
      overflow: hidden;
      border: 2px solid #313946;
      border-radius: 12px;
      background: #111;
      box-shadow: 0 10px 35px rgba(0,0,0,.45);
    }

    .map-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /*
      Clickable overlay aligned to the A1–E5 floor grid in the artwork.
      The artwork remains the visual map; these cells are transparent hit areas.
    */
    .zone-grid {
      position: absolute;
      left: 10.2%;
      top: 12.7%;
      width: 82.4%;
      height: 78.0%;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(5, 1fr);
      z-index: 5;
    }

    .zone {
      position: relative;
      border: 1px solid transparent;
      background: transparent;
      padding: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .zone:hover,
    .zone:focus-visible {
      outline: none;
      border-color: rgba(255,191,47,.9);
      background: rgba(255,191,47,.10);
      box-shadow: inset 0 0 18px rgba(255,191,47,.18);
    }

    .zone.active {
      border-color: var(--gold);
      background: rgba(255,191,47,.13);
      box-shadow: inset 0 0 22px rgba(255,191,47,.24);
    }

    .coord {
      position: absolute;
      top: 4px;
      left: 4px;
      padding: 2px 5px;
      border-radius: 5px;
      color: #fff;
      background: rgba(0,0,0,.68);
      font: 700 10px/1 monospace;
      opacity: 0;
      transition: opacity .12s ease;
    }

    .zone:hover .coord,
    .zone:focus-visible .coord,
    .zone.active .coord {
      opacity: 1;
    }

    .status {
      margin: 10px 2px 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      background: rgba(0,0,0,.58);
    }

    .sheet-backdrop.open { display: block; }

    .sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 18px 18px calc(20px + env(safe-area-inset-bottom));
      border-radius: 18px 18px 0 0;
      background: var(--panel);
      border-top: 1px solid #3a4350;
      box-shadow: 0 -14px 40px rgba(0,0,0,.55);
    }

    .handle {
      width: 42px;
      height: 4px;
      margin: -7px auto 14px;
      border-radius: 999px;
      background: #657080;
    }

    .sheet h2 {
      margin: 0 0 5px;
      color: var(--gold);
      font-size: 22px;
    }

    .sheet .zone-name {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
    }

    .sheet .updated {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .close {
      position: absolute;
      top: 18px;
      right: 18px;
      border: 0;
      border-radius: 8px;
      padding: 7px 10px;
      color: #fff;
      background: #252d39;
      font-weight: 700;
      cursor: pointer;
    }

    @media (min-width: 800px) {
      .wrap { padding-top: 20px; }
      .coord { font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back" href="index.html" aria-label="Back to Cholobots">‹</a>
    <div class="title">
      <strong>GUARDABOT</strong>
      <span>Garage Map · tap a zone</span>
    </div>
  </header>

  <main class="wrap">
    <div class="map-shell" id="mapShell">
      <img
        class="map-art"
        src="assets/guardabot-garage-map.png"
        alt="16-bit Guardabot garage map"
      />
      <div class="zone-grid" id="zoneGrid" aria-label="Garage zones"></div>
    </div>
    <div class="status" id="status">Loading garage zones…</div>
  </main>

  <div class="sheet-backdrop" id="sheetBackdrop" role="dialog" aria-modal="true" aria-labelledby="sheetCell">
    <section class="sheet">
      <div class="handle"></div>
      <button class="close" id="closeSheet" type="button">Close</button>
      <h2 id="sheetCell">A1</h2>
      <p class="zone-name" id="sheetName">Zone</p>
      <p class="updated" id="sheetUpdated"></p>
    </section>
  </div>

  <script>
    const SUPABASE_URL = "https://pjquistiolcoqvcfmqjn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_SrGvJETp3Bpm9i9n1wGheQ_3Ni7FdIv";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ROWS = ["A", "B", "C", "D", "E"];
    const COLS = ["1", "2", "3", "4", "5"];

    const zoneGrid = document.getElementById("zoneGrid");
    const status = document.getElementById("status");
    const sheetBackdrop = document.getElementById("sheetBackdrop");
    const sheetCell = document.getElementById("sheetCell");
    const sheetName = document.getElementById("sheetName");
    const sheetUpdated = document.getElementById("sheetUpdated");
    const closeSheet = document.getElementById("closeSheet");

    const zoneData = new Map();

    function prettyDate(value) {
      if (!value) return "No update date";
      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return value;
      return "Updated " + d.toLocaleString([], {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function buildGrid() {
      for (const row of ROWS) {
        for (const col of COLS) {
          const cell = row + col;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "zone";
          button.dataset.cell = cell;
          button.setAttribute("aria-label", `Garage zone ${cell}`);
          button.innerHTML = `<span class="coord">${cell}</span>`;
          button.addEventListener("click", () => openZone(cell, button));
          zoneGrid.appendChild(button);
        }
      }
    }

    function openZone(cell, button) {
      document.querySelectorAll(".zone.active").forEach(el => el.classList.remove("active"));
      button.classList.add("active");

      const row = zoneData.get(cell);
      sheetCell.textContent = cell;
      sheetName.textContent = row?.zone_name || "Open / unmapped";
      sheetUpdated.textContent = row ? prettyDate(row.updated_at) : "No zone record";
      sheetBackdrop.classList.add("open");
    }

    function closeZone() {
      sheetBackdrop.classList.remove("open");
      document.querySelectorAll(".zone.active").forEach(el => el.classList.remove("active"));
    }

    async function loadZones() {
      try {
        const { data, error } = await sb
          .from("garage_zones")
          .select("cell,zone_name,updated_at")
          .order("cell");

        if (error) throw error;

        (data || []).forEach(row => zoneData.set(String(row.cell).toUpperCase(), row));
        status.textContent = `${zoneData.size} mapped garage zones · tap anywhere on the map`;
      } catch (err) {
        console.error(err);
        status.textContent = "Could not load live garage zones. The map artwork is still available.";
      }
    }

    closeSheet.addEventListener("click", closeZone);
    sheetBackdrop.addEventListener("click", event => {
      if (event.target === sheetBackdrop) closeZone();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeZone();
    });

    buildGrid();
    loadZones();
  </script>
</body>
</html>
