<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Time</title>

<style>
body {
  margin: 0;
  background: #000;
  color: #eee;
  font-family: Arial, sans-serif;
}

.page { padding: 2px; }

.back-link {
  color: #18a8ff;
  text-decoration: none;
  font-size: 0.75rem;
  opacity: 0.6;
  position: fixed;
  top: 2px;
  left: 4px;
  z-index: 10;
}

.status {
  position: fixed;
  top: 3px;
  right: 6px;
  font-size: .62rem;
  color: #777;
  z-index: 10;
}

.planner {
  margin-top: 18px;
  border-top: 1px solid #444;
  border-left: 1px solid #444;
  font-size: 0.72rem;
  overflow: visible;
}

.planner-row {
  display: grid;
  grid-template-columns: 22px repeat(4, 1fr);
  align-items: stretch;
}

.cell {
  min-height: calc((100vh - 24px) / 2);
  height: auto;  border-right: 1px solid #444;
  border-bottom: 1px solid #444;
  padding: 4px;
  box-sizing: border-box;
  overflow: visible;
}

.person {
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  letter-spacing: 1px;
  padding: 0;
  background: #050505;
}

.heaven { color: #18a8ff; }
.daniel { color: #9b6bff; }

.day {
  font-size: 1.75rem;
  font-weight: bold;
  margin-bottom: 4px;
  border-bottom: 1px solid #222;
  padding-bottom: 2px;
}

ul {
  margin: 0;
  padding-left: 12px;
}

li {
  margin-bottom: 4px;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.empty {
  color: #666;
  list-style: none;
  margin-left: -10px;
}

.error { color: #ff7777; }

@media (orientation: portrait) {
  .planner-row {
    grid-template-columns: 24px 1fr;
  }

  .cell {
    height: auto;
    min-height: 120px;
  }

  .person {
    min-height: 480px;
  }
}
</style>
</head>

<body>
<a class="back-link" href="index.html">←</a>
<div class="status" id="status">Loading…</div>

<main class="page">
  <section class="planner">
    <div class="planner-row" id="heaven-row">
      <div class="cell person heaven">HEAVEN</div>
    </div>

    <div class="planner-row" id="daniel-row">
      <div class="cell person daniel">DANIEL</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://pjquistiolcoqvcfmqjn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_SrGvJETp3Bpm9i9n1wGheQ_3Ni7FdIv";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function getNextFourDates() {
  const dates = [];
  const today = new Date();

  for (let i = 0; i < 4; i++) {
    const d = new Date(today);
    d.setDate(today.getDate() + i);
    dates.push(d.toISOString().slice(0, 10));
  }

  return dates;
}

function formatDayLabel(dateString) {
  const date = new Date(dateString + "T12:00:00");
  return date.toLocaleDateString("en-US", { weekday: "short" });
}

function normalizeTask(task) {
  if (typeof task === "string") return task;
  if (task && typeof task === "object") {
    return task.text || task.task || task.title || "";
  }
  return "";
}

function renderRow(rowId, personSchedule, colorClass) {
  const row = document.getElementById(rowId);
  const label = row.querySelector(".person");

  row.innerHTML = "";
  row.appendChild(label);

  const dates = getNextFourDates();

  dates.forEach(dateKey => {
    const cell = document.createElement("div");
    cell.className = "cell";

    const day = document.createElement("div");
    day.className = `day ${colorClass}`;
    day.textContent = formatDayLabel(dateKey);

    const ul = document.createElement("ul");
    const tasks = personSchedule?.[dateKey] || [];

    if (tasks.length === 0) {
      const li = document.createElement("li");
      li.className = "empty";
      li.textContent = "Open";
      ul.appendChild(li);
    } else {
      tasks.forEach(task => {
        const text = normalizeTask(task);
        if (!text) return;

        const li = document.createElement("li");
        li.textContent = text;
        ul.appendChild(li);
      });
    }

    cell.appendChild(day);
    cell.appendChild(ul);
    row.appendChild(cell);
  });
}

async function loadSchedule() {
  const status = document.getElementById("status");

  try {
    const { data, error } = await supabaseClient
      .from("metiche_weekly")
      .select("calendar_json, created_at")
      .order("id", { ascending: false })
      .limit(1)
      .single();

    if (error) throw error;

    const calendar = data?.calendar_json || {};

    renderRow("heaven-row", calendar.Heaven || {}, "heaven");
    renderRow("daniel-row", calendar.Daniel || {}, "daniel");

    status.textContent = "Live";
    status.className = "status";
  } catch (err) {
    console.error("Schedule load failed:", err);
    status.textContent = "Load failed";
    status.className = "status error";
  }
}

loadSchedule();
setInterval(loadSchedule, 60000);
</script>
</body>
</html>
