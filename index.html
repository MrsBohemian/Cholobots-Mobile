<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handley Man Cholobots</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 28px;
      color: #f5f5f5;
      letter-spacing: 1px;
    }

    .menu {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    .menu-item {
      text-decoration: none;
      color: white;
      text-align: center;
      display: block;
    }

    .menu-item img {
      width: 180px;
      max-width: 75%;
      display: block;
      margin: 0 auto 10px;
    }

    .menu-item span {
      display: block;
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .blue { color: #18a8ff; }
    .purple { color: #9b6bff; }
    .green { color: #7ed957; }

    .menu-item:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <h1>Handley Man Cholobots</h1>

  <main class="menu">
    <a class="menu-item" href="time.html">
      <img src="assets/time-clock.png" alt="Time Management">
      <span class="blue">Time Management</span>
    </a>

    <a class="menu-item" href="customers.html">
      <img src="assets/customer-phone.png" alt="Customer Communication">
      <span class="purple">Customer Communication</span>
    </a>

    <a class="menu-item" href="money.html">
      <img src="assets/money-scales.png" alt="Min Max Money">
      <span class="green">Min / Max Money</span>
    </a>
  </main>
</body>
</html>
