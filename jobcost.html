<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Crudobot Job Costing</title>
  <style>
    :root{
      --bg:#050403;
      --panel:#17110d;
      --panel2:#211812;
      --line:#5f3c24;
      --text:#f6eadc;
      --muted:#bda48d;
      --orange:#ff7a18;
      --amber:#ffc247;
      --green:#74dc78;
      --red:#ff6868;
      --steel:#b8c4c8;
      --ink:#160b05;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100dvh;
      background:
        linear-gradient(rgba(255,122,24,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,122,24,.035) 1px, transparent 1px),
        var(--bg);
      background-size:18px 18px;
      color:var(--text);
      font-family:"Courier New", monospace;
    }
    button,select{font:inherit}
    .app{width:min(760px,100%);margin:auto;padding:16px 12px 40px}
    .topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    .back{color:var(--text);text-decoration:none;font-size:28px;line-height:1}
    .title-wrap{flex:1}
    .eyebrow{color:var(--orange);font-size:11px;font-weight:900;letter-spacing:.16em}
    h1{font-size:22px;margin:2px 0 0;line-height:1}
    .refresh{
      border:2px solid var(--line);background:var(--panel);color:var(--amber);
      padding:9px 10px;font-weight:900;box-shadow:3px 3px 0 #000;
    }
    .robot-head{
      border:4px solid #090503;background:var(--steel);color:var(--ink);
      padding:8px;box-shadow:0 0 0 3px var(--line),6px 6px 0 #000;margin-bottom:14px
    }
    .face{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
    .eye{height:22px;background:#1a0c05;border:4px solid #6e7678;position:relative}
    .eye:after{content:"";position:absolute;inset:4px;background:var(--orange)}
    .mouth{background:#1a0c05;color:var(--amber);padding:7px 10px;font-weight:900;text-align:center}
    .controls{
      display:grid;grid-template-columns:1fr auto;gap:8px;
      padding:10px;background:var(--panel);border:2px solid var(--line);margin-bottom:12px
    }
    select{
      min-width:0;background:#090705;color:var(--text);border:2px solid var(--line);
      padding:10px;font-weight:900
    }
    .status{color:var(--muted);font-size:12px;margin:4px 0 12px;min-height:15px}
    .report{display:grid;gap:12px}
    .card{
      background:var(--panel);border:2px solid var(--line);
      box-shadow:4px 4px 0 #000;overflow:hidden
    }
    .card-title{
      background:var(--panel2);border-bottom:2px solid var(--line);
      padding:8px 10px;color:var(--orange);font-size:12px;font-weight:900;letter-spacing:.12em
    }
    .card-body{padding:10px}
    .hero{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .metric{background:#0c0907;border:1px solid #3c2a1e;padding:10px}
    .metric-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
    .metric-value{font-size:22px;font-weight:900;margin-top:4px}
    .profit{color:var(--green)}
    .loss{color:var(--red)}
    .row{
      display:grid;grid-template-columns:1fr auto;gap:12px;
      padding:8px 0;border-bottom:1px dashed #5d4635;align-items:start
    }
    .row:last-child{border-bottom:0}
    .row .label{color:var(--muted)}
    .row .value{text-align:right;font-weight:900}
    .total{font-size:17px;color:var(--amber);border-top:2px solid var(--line);margin-top:5px;padding-top:10px}
    .warning{
      padding:9px;border:2px solid #8e5b1c;background:#2b1a09;color:#ffd98c;
      font-size:12px;line-height:1.45;margin-top:10px
    }
    .note{white-space:pre-wrap;line-height:1.45;color:#ead8c6}
    .details{margin-top:8px}
    summary{cursor:pointer;color:var(--amber);font-weight:900;padding:4px 0}
    .small-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px}
    .small-table th,.small-table td{padding:7px 5px;border-bottom:1px solid #3d2b20;text-align:left;vertical-align:top}
    .small-table th{color:var(--muted)}
    .small-table td:last-child,.small-table th:last-child{text-align:right}
    .empty{color:var(--muted);padding:8px 0}
    .foot{margin-top:14px;text-align:center;color:#7e6959;font-size:10px;letter-spacing:.12em}
    @media(max-width:520px){
      .app{padding:12px 9px 34px}
      .hero{grid-template-columns:1fr 1fr}
      .metric-value{font-size:18px}
      h1{font-size:18px}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <a class="back" href="index.html">←</a>
    <div class="title-wrap">
      <div class="eyebrow">CHOLOBOTS FINANCIAL INTELLIGENCE</div>
      <h1>CRUDOBOT JOB COSTING</h1>
    </div>
    <button class="refresh" onclick="loadReport()">↻</button>
  </div>

  <div class="robot-head">
    <div class="face">
      <div class="eye"></div>
      <div class="mouth" id="robotMessage">SHOW ME THE NUMBERS</div>
      <div class="eye"></div>
    </div>
  </div>

  <div class="controls">
    <select id="projectSelect" onchange="loadReport()"></select>
    <button class="refresh" onclick="loadReport()">LOAD</button>
  </div>
  <div id="status" class="status">Connecting to Supabase…</div>

  <div id="report" class="report"></div>
  <div class="foot">CRUDOBOT PROJECT + MATERIALS + METICHE LABOR + OBIJUAN PAYOUTS</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://pjquistiolcoqvcfmqjn.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_SrGvJETp3Bpm9i9n1wGheQ_3Ni7FdIv";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "")
  .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
  .replaceAll('"',"&quot;").replaceAll("'","&#039;");
const money = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n||0));
const minutesLabel = mins => {
  const total = Number(mins || 0);
  const hours = Math.floor(total / 60);
  const minutes = total % 60;
  if (hours && minutes) return `${hours}h ${minutes}m`;
  if (hours) return `${hours}h`;
  return `${minutes}m`;
};
const signedTransaction = row => {
  const total = Math.abs(Number(row.total || 0));
  return String(row.transaction_type || "").toLowerCase() === "return" ? -total : total;
};
const payoutValue = row => row.paid_amount == null
  ? Number(row.accepted_price || 0)
  : Number(row.paid_amount || 0);

let projectCache = [];

async function loadProjects(){
  const [projectResult, contactResult] = await Promise.all([
    sb.from("crudo_projects")
      .select("id,contact_id,project_name,status,created_at")
      .order("project_name"),
    sb.from("chisme_contacts")
      .select("id,name,first_name,last_name,company")
  ]);

  if(projectResult.error){
    $("status").textContent = "Crudobot projects could not load: " + projectResult.error.message;
    return;
  }

  const contacts = new Map();
  (contactResult.data || []).forEach(c => {
    const person = c.name || [c.first_name,c.last_name].filter(Boolean).join(" ") || c.company || "Unknown customer";
    contacts.set(c.id, person);
  });

  projectCache = (projectResult.data || []).map(p => ({
    ...p,
    customer_name: contacts.get(p.contact_id) || "Unknown customer"
  })).sort((a,b) =>
    `${a.customer_name} ${a.project_name}`.localeCompare(`${b.customer_name} ${b.project_name}`)
  );

  const select = $("projectSelect");
  const requested = new URLSearchParams(location.search).get("project");
  select.innerHTML = projectCache.map(row =>
    `<option value="${esc(row.id)}">${esc(row.customer_name)} — ${esc(row.project_name)}</option>`
  ).join("");

  if(requested && [...select.options].some(o => o.value === requested)) select.value = requested;
  if(!select.value && projectCache.length) select.value = projectCache[0].id;

  if(contactResult.error){
    $("status").textContent = "Projects loaded; customer names could not load: " + contactResult.error.message;
  }
}

async function loadReport(){
  const projectId = $("projectSelect").value;
  if(!projectId){
    $("report").innerHTML = `<div class="card"><div class="card-body empty">No Crudobot projects saved yet.</div></div>`;
    $("status").textContent = "No rows found in crudo_projects.";
    return;
  }

  $("status").textContent = "Crudobot is pulling the project together…";
  $("robotMessage").textContent = "COUNTING THE DAMAGE";

  const projectResult = await sb.from("crudo_projects").select("*").eq("id",projectId).single();
  if(projectResult.error){
    $("status").textContent = "Project record failed: " + projectResult.error.message;
    return;
  }

  const project = projectResult.data;
  const cached = projectCache.find(p => p.id === projectId);
  const customerName = cached?.customer_name || "Unknown customer";

  const [materialPlanResult, txResult, itemResult, laborResult] = await Promise.all([
    sb.from("crudo_project_materials").select("*").eq("project_id",projectId).order("created_at"),
    sb.from("crudo_material_transactions").select("*").eq("project_id",projectId).order("transaction_date"),
    sb.from("crudo_material_transaction_items").select("*").eq("project_id",projectId).order("created_at"),
    sb.from("crudo_labor_entries").select("*").eq("project_id",projectId).order("created_at")
  ]);

  const sourceErrors = [
    materialPlanResult.error, txResult.error, itemResult.error, laborResult.error
  ].filter(Boolean);

  const materialPlan = materialPlanResult.data || [];
  const transactions = txResult.data || [];
  const items = itemResult.data || [];
  const labor = laborResult.data || [];

  // ObiJuan does not currently have project_id. Only query it when a defensible
  // link exists: quest_id exactly equals this Crudobot project UUID.
  let questLabor = [];
  const questResult = await sb.from("obijuan_quest_assignments")
    .select("*").eq("quest_id",projectId).order("accepted_at");
  if(!questResult.error) questLabor = questResult.data || [];

  if(sourceErrors.length){
    $("status").textContent = "Some project-cost sources failed: " + sourceErrors.map(e=>e.message).join(" | ");
  } else {
    $("status").textContent = "Live report loaded from Crudobot and Metiche.";
  }

  const purchases = transactions
    .filter(r => String(r.transaction_type||"").toLowerCase() === "purchase")
    .reduce((sum,r) => sum + Math.abs(Number(r.total || 0)), 0);

  const returns = transactions
    .filter(r => String(r.transaction_type||"").toLowerCase() === "return")
    .reduce((sum,r) => sum + Math.abs(Number(r.total || 0)), 0);

  const materialsActual = purchases - returns;
  const materialsEstimated = Number(project.estimated_materials || 0) ||
    materialPlan.reduce((sum,r) => sum + Number(r.estimated_total || 0), 0);
  const materialVariance = materialsEstimated - materialsActual;

  const laborMinutes = labor.reduce((sum,r) => sum + Number(r.actual_minutes || 0), 0);
  const subcontractLabor = questLabor.reduce((sum,r) => sum + payoutValue(r), 0);

  // We have actual owner labor TIME, but no labor-rate field in the current schema.
  // Do not invent a dollar cost for Heaven/Daniel here.
  const directCashCost = materialsActual + subcontractLabor;
  const revenue = Number(project.contract_amount || 0);
  const cashContribution = revenue - directCashCost;
  const cashMargin = revenue ? cashContribution / revenue * 100 : 0;

  const workerTotals = {};
  labor.forEach(r => {
    const worker = r.worker || "Unknown";
    workerTotals[worker] = (workerTotals[worker] || 0) + Number(r.actual_minutes || 0);
  });

  const outcomes = {
    pending: 0, purchased: 0, on_hand: 0, not_needed: 0, unplanned: 0
  };
  materialPlan.forEach(r => {
    const key = String(r.outcome || "pending").toLowerCase();
    outcomes[key] = (outcomes[key] || 0) + 1;
  });

  $("robotMessage").textContent = "JOB REALITY";
  $("report").innerHTML = `
    <section class="card">
      <div class="card-title">${esc(customerName)} — ${esc(project.project_name)} · ${esc(project.status || "ACTIVE")}</div>
      <div class="card-body hero">
        <div class="metric">
          <div class="metric-label">Contract amount</div>
          <div class="metric-value">${money(revenue)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Cash contribution</div>
          <div class="metric-value ${cashContribution >= 0 ? "profit":"loss"}">${money(cashContribution)}</div>
        </div>
        <div class="metric">
          <div class="metric-label">Cash margin*</div>
          <div class="metric-value ${cashMargin < 0 ? "loss":""}">${cashMargin.toFixed(1)}%</div>
        </div>
        <div class="metric">
          <div class="metric-label">Actual labor time</div>
          <div class="metric-value">${minutesLabel(laborMinutes)}</div>
        </div>
      </div>
      <div class="card-body" style="padding-top:0">
        <div class="warning">*Cash contribution currently subtracts purchased materials net of returns and linked ObiJuan payouts. Owner labor is tracked as time, not yet converted to dollars because the current project schema does not store a costing rate.</div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">PROJECT BASELINE</div>
      <div class="card-body">
        <div class="row"><div class="label">Contract amount</div><div class="value">${money(project.contract_amount)}</div></div>
        <div class="row"><div class="label">Estimated materials</div><div class="value">${money(materialsEstimated)}</div></div>
        <div class="row"><div class="label">Estimated labor</div><div class="value">${project.estimated_labor == null ? "Not saved" : money(project.estimated_labor)}</div></div>
        <div class="row"><div class="label">Owner</div><div class="value">${esc(project.owner || "Not saved")}</div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">MATERIAL COST</div>
      <div class="card-body">
        <div class="row"><div class="label">Estimated materials</div><div class="value">${money(materialsEstimated)}</div></div>
        <div class="row"><div class="label">Gross purchases</div><div class="value">${money(purchases)}</div></div>
        <div class="row"><div class="label">Returns / credits</div><div class="value">${money(-returns)}</div></div>
        <div class="row total"><div>Net purchased materials</div><div class="value">${money(materialsActual)}</div></div>
        <div class="row"><div class="label">Purchase savings vs estimate</div><div class="value ${materialVariance >= 0 ? "profit":"loss"}">${money(materialVariance)}</div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">ACTUAL LABOR — METICHE</div>
      <div class="card-body">
        ${Object.keys(workerTotals).length ? Object.entries(workerTotals).map(([worker,mins]) => `
          <div class="row">
            <div class="label">${esc(worker)}</div>
            <div class="value">${minutesLabel(mins)}</div>
          </div>`).join("") : `<div class="empty">No crudo_labor_entries saved for this project yet.</div>`}
        <div class="row total"><div>Total actual labor</div><div class="value">${minutesLabel(laborMinutes)}</div></div>
        ${labor.length ? `
        <details class="details">
          <summary>Show labor entries (${labor.length})</summary>
          <table class="small-table">
            <thead><tr><th>Worker / source</th><th>Notes</th><th>Time</th></tr></thead>
            <tbody>${labor.map(r=>`
              <tr>
                <td>${esc(r.worker || "Unknown")}<br><span style="color:#8f7865">${esc(r.source || "")}</span></td>
                <td>${esc(r.notes || "")}</td>
                <td>${minutesLabel(r.actual_minutes)}</td>
              </tr>`).join("")}
            </tbody>
          </table>
        </details>` : ""}
      </div>
    </section>

    <section class="card">
      <div class="card-title">MATERIAL PLAN / OUTCOMES</div>
      <div class="card-body">
        ${materialPlan.length ? `
          <div class="row"><div class="label">Pending</div><div class="value">${outcomes.pending || 0}</div></div>
          <div class="row"><div class="label">Purchased</div><div class="value">${outcomes.purchased || 0}</div></div>
          <div class="row"><div class="label">Already on hand</div><div class="value">${outcomes.on_hand || 0}</div></div>
          <div class="row"><div class="label">Not needed</div><div class="value">${outcomes.not_needed || 0}</div></div>
          <div class="row"><div class="label">Unplanned</div><div class="value">${outcomes.unplanned || 0}</div></div>
          <details class="details">
            <summary>Show material plan (${materialPlan.length})</summary>
            <table class="small-table">
              <thead><tr><th>Material</th><th>Outcome</th><th>Estimate</th></tr></thead>
              <tbody>${materialPlan.map(r=>`
                <tr>
                  <td>${esc(r.item_name)}<br><span style="color:#8f7865">${esc(r.estimated_quantity ?? "")} ${esc(r.estimated_unit || "")}</span></td>
                  <td>${esc(r.outcome || "pending")}</td>
                  <td>${money(r.estimated_total)}</td>
                </tr>`).join("")}
              </tbody>
            </table>
          </details>
        ` : `<div class="empty">No estimated material lines saved for this project yet.</div>`}
      </div>
    </section>

    <section class="card">
      <div class="card-title">MATERIAL TRANSACTIONS — CRUDOBOT</div>
      <div class="card-body">
        ${transactions.length ? `
        <table class="small-table">
          <thead><tr><th>Date / Vendor</th><th>Type</th><th>Total</th></tr></thead>
          <tbody>${transactions.map(r=>`
            <tr>
              <td>${esc(r.transaction_date || "")}<br>${esc(r.vendor || "Unknown")}</td>
              <td>${esc(r.transaction_type || "")}</td>
              <td>${money(signedTransaction(r))}</td>
            </tr>`).join("")}
          </tbody>
        </table>` : `<div class="empty">No Crudobot purchase or return receipts saved for this project yet.</div>`}
        <details class="details">
          <summary>Show receipt material lines (${items.length})</summary>
          ${items.length ? `
            <table class="small-table">
              <thead><tr><th>Material</th><th>Qty / Unit</th><th>Total</th></tr></thead>
              <tbody>${items.map(i=>`
                <tr>
                  <td>${esc(i.item_name || "")}${i.sku ? `<br><span style="color:#8f7865">SKU ${esc(i.sku)}</span>`:""}</td>
                  <td>${esc(i.quantity ?? 0)} ${esc(i.unit || "")}</td>
                  <td>${money(i.line_total)}</td>
                </tr>`).join("")}
              </tbody>
            </table>` : `<div class="empty">No parsed receipt lines yet.</div>`}
        </details>
      </div>
    </section>

    <section class="card">
      <div class="card-title">OBIJUAN QUEST PAYOUTS</div>
      <div class="card-body">
        ${questLabor.length ? questLabor.map(r=>`
          <div class="row">
            <div>
              <div>${esc(r.worker_name || "Worker")}</div>
              <div class="label">${esc(r.status || "accepted")}</div>
            </div>
            <div class="value">${money(payoutValue(r))}</div>
          </div>`).join("") :
          `<div class="empty">No ObiJuan payout is linked to this Crudobot project UUID. ObiJuan currently stores quest_id as text, not project_id, so unrelated quests are not guessed into this report.</div>`}
      </div>
    </section>

    <section class="card">
      <div class="card-title">CRUDOBOT NOTES</div>
      <div class="card-body note">${esc(project.scope_notes || "No project scope notes saved.")}</div>
    </section>
  `;
}

(async function init(){
  await loadProjects();
  await loadReport();
})();
</script>
</body>
</html>
